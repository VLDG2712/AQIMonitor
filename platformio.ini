[env:esp32dev]
monitor_speed = 115200
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
#lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	adafruit/Adafruit BMP5xx Library@^1.0.2
	bblanchon/ArduinoJson@^7.2.2
	adafruit/Adafruit AHTX0@^2.0.6
	adafruit/Adafruit NeoPixel
	fu-hsi/PMS Library@^1.1.0
	adafruit/ENS160 - Adafruit Fork@^3.0.1
	adafruit/Adafruit BusIO@^1.17.4
	links2004/WebSockets@^2.4.1
build_flags =
  -DUSER_SETUP_LOADED
  -DST7789_DRIVER
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=26
  -DTFT_SCLK=25
  -DTFT_CS=12
  -DTFT_DC=14
  -DTFT_RST=27
  -DTFT_BL=13
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_GFXFF
  -DSMOOTH_FONT
  -DSPI_FREQUENCY=10000000
